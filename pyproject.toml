[project]
name = "tpm-intelligence"
version = "0.1.0"
description = "Predicts which features in a multi-team software release will slip, and explains why."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "redis>=5.2",
    "google-cloud-pubsub>=2.27",
    "sqlalchemy>=2.0.36,<2.1",  # OTel instrumentation supports < 2.1
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "pyyaml>=6.0",
    "networkx>=3.4",
    "numpy>=2.1",
    "anthropic>=1.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "langgraph>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "fakeredis>=2.26",
    "types-pyyaml>=6.0",
    "types-networkx>=3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agents",
    "api",
    "collectors",
    "connectors",
    "engine",
    "evals",
    "linker",
    "observability",
    "pipeline",
    "simulator",
    "verify",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["web", "infra"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PT", "C4", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"pipeline/store/migrations/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "agents", "api", "collectors", "connectors", "engine", "evals", "linker",
    "observability", "pipeline", "simulator", "verify",
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
packages = [
    "agents", "api", "collectors", "connectors", "engine", "evals", "linker",
    "observability", "pipeline", "simulator", "verify",
]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_incomplete_defs = true

# CLAUDE.md section 4: strict for the fact-producing packages.
[[tool.mypy.overrides]]
module = ["engine.*", "linker.*", "verify.*"]
strict = true

[[tool.mypy.overrides]]
module = ["opentelemetry.instrumentation.*", "google.cloud.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs running services (Postgres, Redis); run with `make test-integration`",
]
