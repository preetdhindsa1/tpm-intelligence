# Kubernetes release calendar: the source of truth for freeze dates.
# Decision 2026-11-21: a checked-in calendar instead of parsing sig-release markdown.
# Each entry cites its source; tests pin the v1.38 values. Times are UTC.
# Enhancements and Code Freeze are "AoE day / next day 12:00 UTC" in the source.
project: kubernetes
releases:
  - name: v1.33
    cycle_start: 2025-01-13T00:00:00Z
    enhancements_freeze: 2025-02-14T02:00:00Z
    code_freeze: 2025-03-21T02:00:00Z
    release: 2025-04-23T00:00:00Z
