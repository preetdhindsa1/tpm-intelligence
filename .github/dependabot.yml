# Dependency update PRs (roadmap hardening, #18). Minor and patch updates arrive as one
# grouped PR per ecosystem each week; major upgrades are deliberate changes, not automatic
# PRs (the first run opened 13, mostly majors, including Python 3.15 against CLAUDE.md's
# 3.12; #34). Every PR runs the full CI, including the dependency and secret scans.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # SQLAlchemy 2.1 is outside OpenTelemetry's instrumentation range (0.66b2 supports
      # < 2.1); merging it lost database spans (2026-11-24). Lift once that changes.
      - dependency-name: sqlalchemy
        versions: [">=2.1"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Base images: patch releases only. Python stays 3.12 (CLAUDE.md), Node stays 20.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major, version-update:semver-minor]
