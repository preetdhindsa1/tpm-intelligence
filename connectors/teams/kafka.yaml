# Second example shape: Jira plan + GitHub code (most companies).
# The Jira collector syncs the plan hourly in the cloud; the GitHub poller syncs apache/kafka
# PRs every 5 minutes (#47).
id: kafka
display_name: Apache Kafka
project: KAFKA
link_pack: jira_key
planning:
  source: jira
  base_url: https://issues.apache.org/jira
  project_key: KAFKA
code:
  repos:
    - apache/kafka
# Kafka's release managers drop slipped features from a fix version weeks after Feature
# Freeze (the engine's Code Freeze), up to the release: judge "landed" at the release (#86).
landed_at: release
# Kafka calls the date the engine treats as Code Freeze its "Feature Freeze" (ADR-0018).
code_freeze_label: Feature Freeze
calendar:
  # Placeholder calendar path — replace with a real Kafka release calendar when collecting.
  path: connectors/teams/kafka-calendar.yaml
