# Copy to <your-team-id>.yaml and fill in. Then:
#   1. Add a release calendar YAML (see collectors/github_poller/release_calendar.yaml).
#   2. Pick link_pack: kep (KEP/enhancement issues) or jira_key (PROJ-123 in PR text).
#   3. For GitHub planning: make poll --team <id> --release <name>
#   4. For Jira planning: implement collectors/jira (config is ready; collector TBD).
# No changes to engine/, api/, or pipeline/ should be required.
id: acme
display_name: Acme Platform
project: acme
link_pack: jira_key
planning:
  source: github
  repo: acme/planning
code:
  repos:
    - acme/service
calendar:
  path: connectors/teams/acme-calendar.yaml
# Optional. Your name for the calendar's code_freeze date, shown where the Verify stage
# starts: "Code Freeze" (default), "Feature Freeze", "Release cut", "Feature complete".
# code_freeze_label: Code Freeze
# Optional. Omit both keys for a team with no development lab.
# author_lanes:            # first matching rule wins: label, then branch, then trailer
#   claude:
#     labels: [claude-agent]
#     branch_prefixes: ["claude/"]
#     trailers: ["Co-Authored-By: Claude"]
# reviewer_pool: []
# Optional. Conversations the team's programs read (ADR-0030). Read-only; secrets stay in
# the environment (Secret Manager in the cloud), never here.
# conversations:
#   - kind: google_doc        # public meeting-notes document
#     document_id: 1AbC...
#     title: Release team meeting
#     release: "1.0"
#   - kind: slack_channel     # needs SLACK_BOT_TOKEN; add the bot to the channel
#     channel_id: C0123456789
#     title: "#release"
