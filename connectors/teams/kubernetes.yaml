# Public release-team meeting notes (ADR-0030), linked from
# kubernetes/sig-release/releases/release-1.38/links.md. Read with the Google Drive API.
# Public lists of the release team, release managers and SIG leads. Read only to mask people's names
# in the notes before RAID extraction (ADR-0030 addendum 4); names are never stored.
people_sources:
  - kubernetes/sig-release/releases/release-1.38/release-team.md
  - kubernetes/sig-release/releases/release-1.37/release-team.md
  - kubernetes/website/content/en/releases/release-managers.md
  # SIG chairs and tech leads, named in retros (#183).
  - kubernetes/community/sigs.yaml
conversations:
