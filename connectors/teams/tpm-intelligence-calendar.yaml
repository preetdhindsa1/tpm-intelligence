# Program Intelligence Platform release calendar (ADR-0020). The GitHub milestone must be named like
# the release ("Phase 3"). Dates set by the owner on 2026-11-23: the cycle avoids the
# US Thanksgiving week and the holiday change moratorium (about Dec 18 - Jan 4), so
# code freeze falls ten working days after people return. Times are UTC.
project: tpm-intelligence
releases:
  - name: "Paltform Intelligence Release"
    cycle_start: 2026-05-30T00:00:00Z
    enhancements_freeze: 2026-07-14T12:00:00Z # planning freeze: Phase 3 issues set
    code_freeze: 2026-08-14T12:00:00Z
    release: 2027-11-20T00:00:00Z
    source_url: https://github.com/preetdhindsa1/tpm-intelligence/milestones
