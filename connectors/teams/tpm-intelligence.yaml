# This project tracks its own development (P3-M5, ADR-0020): real data, not a sample.
# Plans are GitHub issues in a milestone named after the release; code is PRs that close
# them ("Fixes #12"). GitHub App webhooks deliver events in seconds; the poller can
# reconcile. Its own project key, so it never mixes with Kubernetes or Kafka.
id: tpm-intelligence
display_name: Program Intelligence Platform (Current Project)
project: tpm-intelligence
link_pack: github_issue
planning:
  source: github
  repo: preetdhindsa1/tpm-intelligence
code:
  repos:
    - preetdhindsa1/tpm-intelligence
calendar:
  path: connectors/teams/tpm-intelligence-calendar.yaml
# First matching lane wins: label, then branch prefix, then trailer.
# Dependabot is not a lane. The contributor login is not used.
author_lanes:
  claude:
    labels: [claude-agent]
    branch_prefixes: ["claude/"]
    trailers: ["Co-Authored-By: Claude"]
  cursor:
    labels: [cursor-agent]
    branch_prefixes: ["cursor/"]
    trailers: ["Co-authored-by: Cursor Agent"]
  human:
    labels: [harpreet]
    branch_prefixes: ["harpreet/"]
    trailers: []
reviewer_pool: [preetdhindsa1]
